name: iPhone IPA

on:
  workflow_dispatch:
    inputs:
      publish_development:
        description: 'Save a development snapshot before feature acceptance finishes'
        type: boolean
        default: false
      review_scope:
        description: 'Build only for phone review, or explicitly run simulator checks'
        type: choice
        options: [build_only, functional, full, changed_ui]
        default: build_only
      runner:
        description: 'iOS 27 tools on the standard free public-repository Apple runner'
        type: choice
        options: [xcode-27]
        default: xcode-27
  push:
    paths:
      - 'ios/Sonora/**'
      - 'ios/Sonora.xcodeproj/**'
      - 'ios/scripts/**'
      - 'ios/UITests/**'
      - 'ios/Core/**'
      - 'crates/music/src/equalizer/**'
      - 'crates/music/src/local/store.rs'
      - 'crates/music/src/local_ids.rs'
      - 'crates/storage/**'
      - 'Cargo.toml'
      - 'crates/music/src/lyrics/**'
      - 'crates/music/src/models.rs'
      - 'crates/music/src/youtube/lyrics.rs'
      - 'crates/music/src/youtube/wire.rs'
      - 'crates/music/src/binimum/**'
      - 'crates/music/src/musixmatch/**'
      - 'crates/music/src/lrclib/**'
      - 'crates/music/src/kugou/**'
      - 'crates/music/src/netease/**'
      - 'crates/music/src/escape.rs'
      - 'assets/i18n/en-US/main.ftl'
      - 'assets/macos/sonora.icns'
      - '.github/workflows/iphone.yml'
  pull_request:
    paths:
      - 'ios/Sonora/**'
      - 'ios/Sonora.xcodeproj/**'
      - 'ios/scripts/**'
      - 'ios/UITests/**'
      - 'ios/Core/**'
      - 'crates/music/src/equalizer/**'
      - 'crates/music/src/local/store.rs'
      - 'crates/music/src/local_ids.rs'
      - 'crates/storage/**'
      - 'Cargo.toml'
      - 'crates/music/src/lyrics/**'
      - 'crates/music/src/models.rs'
      - 'crates/music/src/youtube/lyrics.rs'
      - 'crates/music/src/youtube/wire.rs'
      - 'crates/music/src/binimum/**'
      - 'crates/music/src/musixmatch/**'
      - 'crates/music/src/lrclib/**'
      - 'crates/music/src/kugou/**'
      - 'crates/music/src/netease/**'
      - 'crates/music/src/escape.rs'
      - 'assets/i18n/en-US/main.ftl'
      - '.github/workflows/iphone.yml'

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      IPHONEOS_DEPLOYMENT_TARGET: '26.0'
      SONORA_SMOKE_VIDEO_ID: ${{ vars.SONORA_SMOKE_VIDEO_ID }}
      SONORA_REVIEW_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.review_scope || 'build_only' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/Core -> target
          cache-on-failure: true
      - name: Build shared YouTube provider libraries
        run: python3 ios/scripts/build_native.py
      - name: Prepare native project
        run: python3 ios/scripts/prepare.py
      - name: Build iPhone app without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/Sonora.xcodeproj -scheme Sonora \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned device IPA
        env:
          SONORA_BUILD_KIND: ${{ (env.SONORA_REVIEW_SCOPE == 'build_only' || (github.event_name == 'workflow_dispatch' && inputs.publish_development)) && 'development' || 'acceptance-candidate' }}
        run: python3 ios/scripts/package_ipa.py
      - name: Upload explicitly requested development snapshot
        if: env.SONORA_REVIEW_SCOPE == 'build_only' || (github.event_name == 'workflow_dispatch' && inputs.publish_development)
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-iPhone-development
          path: |
            ios/build/Sonora-unsigned.ipa
            ios/build/ipa-build-info.json
          retention-days: 7
          if-no-files-found: error
      - name: Build simulator app
        if: env.SONORA_REVIEW_SCOPE != 'build_only'
        run: |
          xcodebuild -project ios/Sonora.xcodeproj -scheme Sonora \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/simulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing
          codesign --force --sign - --entitlements ios/Sonora/Simulator.entitlements \
            ios/build/simulator/Build/Products/Debug-iphonesimulator/Sonora.app
          codesign --verify --strict ios/build/simulator/Build/Products/Debug-iphonesimulator/Sonora.app
      - name: Run explicitly selected iPhone 13 iOS 27 checks
        if: env.SONORA_REVIEW_SCOPE != 'build_only'
        run: python3 ios/scripts/simulator_smoke.py
      - name: Upload unsigned IPA after simulator acceptance
        if: env.SONORA_REVIEW_SCOPE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-iPhone-unsigned
          path: |
            ios/build/Sonora-unsigned.ipa
            ios/build/ipa-build-info.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload simulator screenshots and device details
        if: always() && env.SONORA_REVIEW_SCOPE != 'build_only'
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-iPhone-simulator-review
          path: |
            ios/build/review/*.json
            ios/build/review/*.png
          retention-days: 7
      - name: Upload detailed touch-test diagnostics
        if: always() && env.SONORA_REVIEW_SCOPE != 'build_only'
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-iPhone-touch-review
          path: ios/build/review/MusicInteractions.xcresult/
          retention-days: 7
          if-no-files-found: ignore
