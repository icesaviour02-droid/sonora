name: Mobile YouTube core

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/Core/**'
      - 'crates/music/src/equalizer/**'
      - 'crates/music/src/lyrics/**'
      - 'crates/music/src/models.rs'
      - 'crates/music/src/youtube/lyrics.rs'
      - 'crates/music/src/youtube/wire.rs'
      - 'crates/music/src/binimum/**'
      - 'crates/music/src/musixmatch/**'
      - 'crates/music/src/lrclib/**'
      - 'crates/music/src/kugou/**'
      - 'crates/music/src/netease/**'
      - 'crates/music/src/escape.rs'
      - 'ios/scripts/audio_effects_check.py'
      - 'ios/scripts/lyrics_check.py'
      - 'ios/scripts/cancellation_check.py'
      - '.github/workflows/mobile-core.yml'
  pull_request:
    paths:
      - 'ios/Core/**'
      - 'crates/music/src/equalizer/**'
      - 'crates/music/src/lyrics/**'
      - 'crates/music/src/models.rs'
      - 'crates/music/src/youtube/lyrics.rs'
      - 'crates/music/src/youtube/wire.rs'
      - 'crates/music/src/binimum/**'
      - 'crates/music/src/musixmatch/**'
      - 'crates/music/src/lrclib/**'
      - 'crates/music/src/kugou/**'
      - 'crates/music/src/netease/**'
      - 'crates/music/src/escape.rs'
      - 'ios/scripts/audio_effects_check.py'
      - 'ios/scripts/lyrics_check.py'
      - 'ios/scripts/cancellation_check.py'
      - '.github/workflows/mobile-core.yml'

permissions:
  contents: read

concurrency:
  group: mobile-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-library:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '26.0'
      # The desktop rust-toolchain.toml otherwise overrides the toolchain whose iOS targets
      # were installed by the setup action.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/Core -> target
          cache-on-failure: true
      - name: Check Rust style and contracts
        run: |
          cargo fmt --manifest-path ios/Core/Cargo.toml -- --check
          cargo clippy --manifest-path ios/Core/Cargo.toml --locked -- -D warnings
      - name: Verify shared desktop filters and native audio boundary
        run: |
          cargo test --manifest-path ios/Core/Cargo.toml --locked --lib
          cargo build --manifest-path ios/Core/Cargo.toml --locked
          python3 ios/scripts/audio_effects_check.py ios/Core/target/debug/libsonora_mobile_core.dylib
          python3 ios/scripts/lyrics_check.py ios/Core/target/debug/libsonora_mobile_core.dylib
          python3 ios/scripts/cancellation_check.py ios/Core/target/debug/libsonora_mobile_core.dylib
      - name: Build native iPhone and simulator libraries
        run: |
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          cargo build --manifest-path ios/Core/Cargo.toml --locked --release --target aarch64-apple-ios
          cargo build --manifest-path ios/Core/Cargo.toml --locked --release --target aarch64-apple-ios-sim
      - name: Upload native libraries for integration
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-YouTube-native-libraries
          path: |
            ios/Core/target/aarch64-apple-ios/release/libsonora_mobile_core.a
            ios/Core/target/aarch64-apple-ios-sim/release/libsonora_mobile_core.a
            ios/Core/include/sonora_mobile.h
          retention-days: 3
          if-no-files-found: error
