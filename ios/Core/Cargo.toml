[workspace]
members = ["."]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
# Match the desktop lockfile. Keep provider fixes shared rather than reimplementing InnerTube.
ytmusic = { git = "https://github.com/sonorahq/ytmusic-rs", rev = "8553a967e9ab980e4f94283821e3f6c698b7c40c" }
rquickjs = { version = "0.12", features = ["bindgen"] }

[package]
name = "sonora-mobile-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ytmusic.workspace = true

# Upstream ships desktop bindings but no pre-generated iOS bindings. Generate those against
# the selected Apple SDK instead of copying macOS ABI declarations into the iPhone build.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
